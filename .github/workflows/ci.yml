name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check every .js file
        run: find . -name '*.js' -not -path './.git/*' -exec node --check {} \;
